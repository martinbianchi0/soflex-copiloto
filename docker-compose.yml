services:
  copiloto:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Opcional: sin `.env` levanta con los valores por defecto (modo `mock`).
      - path: .env
        required: false
    environment:
      # Fijas dentro del contenedor: un `.env` no puede sacar el estado del volumen.
      SQLITE_PATH: /data/llamadas.sqlite
      STATIC_DIR: /app/static
      # Se cambian desde el entorno o desde `.env` (ver `.env.example`).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      # El Ollama de la máquina, visto desde el contenedor. Sólo se usa con LLM_PROVIDER=ollama.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # En Linux ese nombre no existe si no se declara.
      - "host.docker.internal:host-gateway"
    volumes:
      # El estado de las llamadas queda fuera del contenedor: sobrevive a `down` y a `up --build`.
      - llamadas:/data

volumes:
  llamadas:
